name: Validate MLS and Space contracts

on:
  push:
    branches: [main, release/mls-v2-main-validation]
  pull_request:
    paths:
      - 'src/**'
      - 'atproto-spaces/**'
      - 'tests/**'
      - 'Cargo.*'
      - '.github/workflows/mls-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      # Fetch git dependencies with the git CLI so the jacquard mirror below
      # applies, abort a transfer stalled under 1 KB/s for 60 s, and retry.
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_NET_RETRY: '10'
      GIT_HTTP_LOW_SPEED_LIMIT: '1000'
      GIT_HTTP_LOW_SPEED_TIME: '60'
    steps:
      - uses: actions/checkout@v4
        with:
          path: catbird-atproto
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: joshlacal/Petrel
          ref: cd6dda0d25c1d2ab2365eb8f6ba2f4568960dd07
          path: Petrel
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: joshlacal/catbird-mls
          # The catbird-mls and labyrinth commits the at:space/ CatbirdMLSCore
          # FFI release is built from (Scripts/ffi-release-inputs.json). Move
          # them together with it. Their lockfiles take jacquard from the same
          # joshlacal/jacquard rev as this repository, as --locked requires.
          ref: 6d78460b676002980192ee4bab27def048e6353b
          path: catbird-mls
      - uses: actions/checkout@v4
        with:
          repository: joshlacal/labyrinth
          ref: ba2a0ecb7473b8d36dd09334a7bdc8a8b3a4bac5
          path: labyrinth
      - name: Fetch jacquard from its GitHub mirror
        # tangled.org stalls or resets clones of jacquard (Nov 21 this job hung
        # 45 min and was cancelled). Cargo.lock now takes jacquard from the
        # joshlacal/jacquard fork; the redirect stays for any older lockfile.
        run: git config --global url."https://github.com/joshlacal/jacquard".insteadOf "https://tangled.org/nonbinary.computer/jacquard"
      - name: Install compiler
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            catbird-atproto/target
            catbird-mls/target
          key: ${{ runner.os }}-mls-contracts-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('catbird-atproto/Cargo.lock', 'catbird-mls/Cargo.lock') }}
      - name: Verify chat recovery and existing Space contracts
        working-directory: catbird-atproto
        run: cargo test --locked --features streaming,namespace-atproto-space --test blue_catbird_chat_surface --test com_atproto_space_surface
      - name: Verify the Petrel-backed Spaces compatibility library
        working-directory: catbird-atproto
        run: |
          cargo test --locked -p atproto-spaces
          tree=$(cargo tree --locked -p atproto-spaces -e normal,build)
          if grep -E 'jacquard[- ]|catbird-atproto v' <<< "$tree"; then
            exit 1
          fi
      - name: Compile released native consumer against this SDK
        working-directory: catbird-mls
        # The released lock predates the Petrel backend of this path dependency.
        run: cargo check --lib
