name: Validate MLS and Space contracts

on:
  push:
    branches: [main, release/mls-v2-main-validation]
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.*'
      - '.github/workflows/mls-contracts.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: '1.97.1'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catbird-atproto
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: joshlacal/catbird-mls
          # Head of codex/main-consolidation-native-20261002: the last public
          # clean-chat-line revision before catbird-mls added the private
          # labyrinth path dependency. 1495be65 predates the direct-request
          # chat surface and no longer compiles against this SDK.
          ref: 94a55cab94918415fe8e585c7ed720fe63063f67
          path: catbird-mls
      - name: Install compiler
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            catbird-atproto/target
            catbird-mls/target
          key: ${{ runner.os }}-mls-contracts-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('catbird-atproto/Cargo.lock', 'catbird-mls/Cargo.lock') }}
      - name: Verify chat recovery and existing Space contracts
        working-directory: catbird-atproto
        run: cargo test --locked --features streaming,namespace-atproto-space --test blue_catbird_chat_surface --test com_atproto_space_surface
      - name: Compile released native consumer against this SDK
        working-directory: catbird-mls
        run: cargo check --locked --lib
