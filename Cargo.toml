[workspace]
members = [".", "atproto-spaces"]

[package]
name = "catbird-atproto"
version = "0.1.0"
edition = "2021"
description = "Shared generated AT Protocol lexicon surface for Catbird Rust crates"

[features]
default = ["namespace-bluecatbird", "namespace-atproto-space"]
namespace-atproto-space = []
namespace-bluecatbird = []
namespace-site-standard = []
streaming = ["jacquard-common/websocket", "dep:serde_ipld_dagcbor"]

[dependencies]
bytes = { version = "1", features = ["serde"] }
jacquard-common = { git = "https://github.com/joshlacal/jacquard", rev = "7a695dd560c0da2df578f6088e3db1e6026e3825" }
jacquard-derive = { git = "https://github.com/joshlacal/jacquard", rev = "7a695dd560c0da2df578f6088e3db1e6026e3825" }
jacquard-lexicon = { git = "https://github.com/joshlacal/jacquard", rev = "7a695dd560c0da2df578f6088e3db1e6026e3825" }
miette = "7"
rustversion = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ipld_dagcbor = { version = "0.6", optional = true }
thiserror = "1"
unicode-segmentation = "1"

[dev-dependencies]
serde_ipld_dagcbor = "0.6"
