[package]
name = "catbird-atproto"
version = "0.1.0"
edition = "2021"
description = "Shared generated AT Protocol lexicon surface for Catbird Rust crates"

[features]
default = ["namespace-bluecatbird"]
namespace-atproto-space = []
namespace-bluecatbird = []
namespace-site-standard = []
streaming = ["jacquard-common/websocket", "dep:serde_ipld_dagcbor"]

[dependencies]
bytes = { version = "1.12.1", features = ["serde"] }
jacquard-common = { git = "https://github.com/joshlacal/jacquard", rev = "1f5bcf1570c5978aa03d997dd7eef0b9ef25430d" }
jacquard-derive = { git = "https://github.com/joshlacal/jacquard", rev = "1f5bcf1570c5978aa03d997dd7eef0b9ef25430d" }
jacquard-lexicon = { git = "https://github.com/joshlacal/jacquard", rev = "1f5bcf1570c5978aa03d997dd7eef0b9ef25430d" }
miette = "7.6.0"
rustversion = "1.0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_ipld_dagcbor = { version = "0.7.0", optional = true }
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"

[dev-dependencies]
serde_ipld_dagcbor = "0.7.0"
