[package]
name = "catbird-atproto"
version = "0.1.0"
edition = "2021"
description = "Shared generated AT Protocol lexicon surface for Catbird Rust crates"

[features]
default = ["namespace-bluecatbird"]
namespace-bluecatbird = []
namespace-site-standard = []
namespace-atproto-space = []
streaming = ["jacquard-common/websocket", "dep:serde_ipld_dagcbor"]

[dependencies]
bytes = { version = "1", features = ["serde"] }
jacquard-common = { git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40" }
jacquard-derive = { git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40" }
jacquard-lexicon = { git = "https://tangled.org/nonbinary.computer/jacquard", rev = "3287244a99262a361bd32873a871982da0a76c40" }
miette = "7"
rustversion = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ipld_dagcbor = { version = "0.6", optional = true }
thiserror = "1"
unicode-segmentation = "1"
